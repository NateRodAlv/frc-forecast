name: Refresh data and deploy site

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours; TBA answers 304 for unchanged data so this is cheap
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Restore TBA response cache (ETags)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tba-cache-${{ github.run_id }}
          restore-keys: tba-cache-
      - name: Build model + site data
        env:
          TBA_KEY: ${{ secrets.TBA_KEY }}
        run: python backend/run.py --target-year ${{ vars.TARGET_YEAR || '2027' }} --nsims 500
      - name: Save TBA cache (even if the build failed, so a re-run resumes)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: tba-cache-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
